version: "3.9"

# ---------------------------------------------------------------------------
# Production docker-compose: .NET microservices only.
# All infrastructure (DB, cache, MQ, search, tracing) runs on AWS:
#   PostgreSQL     → Amazon RDS
#   Redis          → Amazon ElastiCache
#   RabbitMQ       → Amazon MQ
#   Elasticsearch  → Amazon OpenSearch Service
#   Zipkin         → AWS X-Ray
#
# For local development without AWS, use:
#   docker compose -f docker-compose.yml -f docker-compose.local.yml up
# ---------------------------------------------------------------------------

networks:
  ecommerce-net:
    driver: bridge

x-common: &common
  restart: unless-stopped
  networks:
    - ecommerce-net

x-aws-env: &aws-env
  ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Production}
  DOTNET_RUNNING_IN_CONTAINER: "true"
  # AWS SDK configuration (credentials via ECS task role in production)
  AWS_REGION: ${AWS_REGION:-us-east-1}
  # OpenTelemetry → AWS X-Ray (ADOT sidecar on port 4317)
  OpenTelemetry__OtlpEndpoint: http://otel-collector:4317
  # Authentication
  Authentication__Authority: ${IDENTITY_AUTHORITY}
  Authentication__Audience: api

services:

  # ── ADOT Collector (AWS Distro for OpenTelemetry) ─────────────────────────
  # Receives OTLP traces from all services and forwards to AWS X-Ray
  otel-collector:
    <<: *common
    image: public.ecr.aws/aws-observability/aws-otel-collector:latest
    command: ["--config=/etc/otel/config.yaml"]
    volumes:
      - ./docker/otel/config.yaml:/etc/otel/config.yaml:ro
    environment:
      AWS_REGION: ${AWS_REGION:-us-east-1}
    ports:
      - "4317:4317"   # OTLP gRPC
      - "4318:4318"   # OTLP HTTP

  # ── Identity Service ──────────────────────────────────────────────────────
  identity-api:
    <<: *common
    image: ${ECR_REGISTRY}/identity-api:${IMAGE_TAG:-latest}
    build:
      context: .
      dockerfile: src/Services/Identity/Identity.Api/Dockerfile
    environment:
      <<: *aws-env
      ConnectionStrings__DefaultConnection: ${IDENTITY_DB_CONNECTION}
      ASPNETCORE_URLS: http://+:8080
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5

  # ── Catalog Service ───────────────────────────────────────────────────────
  catalog-api:
    <<: *common
    image: ${ECR_REGISTRY}/catalog-api:${IMAGE_TAG:-latest}
    build:
      context: .
      dockerfile: src/Services/Catalog/Catalog.Api/Dockerfile
    environment:
      <<: *aws-env
      ConnectionStrings__CatalogDb: ${CATALOG_DB_CONNECTION}
      ConnectionStrings__Redis: ${ELASTICACHE_ENDPOINT}
      RabbitMQ__Host: ${AMAZON_MQ_ENDPOINT}
      RabbitMQ__Username: ${AMAZON_MQ_USER}
      RabbitMQ__Password: ${AMAZON_MQ_PASSWORD}
      OpenSearch__Endpoint: ${OPENSEARCH_ENDPOINT}
      ASPNETCORE_URLS: http://+:8080
    depends_on:
      identity-api:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5

  # ── Order Service ─────────────────────────────────────────────────────────
  order-api:
    <<: *common
    image: ${ECR_REGISTRY}/order-api:${IMAGE_TAG:-latest}
    build:
      context: .
      dockerfile: src/Services/Order/Order.Api/Dockerfile
    environment:
      <<: *aws-env
      ConnectionStrings__OrderDb: ${ORDER_DB_CONNECTION}
      ConnectionStrings__Redis: ${ELASTICACHE_ENDPOINT}
      RabbitMQ__Host: ${AMAZON_MQ_ENDPOINT}
      RabbitMQ__Username: ${AMAZON_MQ_USER}
      RabbitMQ__Password: ${AMAZON_MQ_PASSWORD}
      ASPNETCORE_URLS: http://+:8080
    depends_on:
      identity-api:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5

  # ── Inventory Service ─────────────────────────────────────────────────────
  inventory-api:
    <<: *common
    image: ${ECR_REGISTRY}/inventory-api:${IMAGE_TAG:-latest}
    build:
      context: .
      dockerfile: src/Services/Inventory/Inventory.Api/Dockerfile
    environment:
      <<: *aws-env
      ConnectionStrings__InventoryDb: ${INVENTORY_DB_CONNECTION}
      RabbitMQ__Host: ${AMAZON_MQ_ENDPOINT}
      RabbitMQ__Username: ${AMAZON_MQ_USER}
      RabbitMQ__Password: ${AMAZON_MQ_PASSWORD}
      ASPNETCORE_URLS: http://+:8080
      ASPNETCORE_Kestrel__Endpoints__gRPC__Url: http://+:8090
      ASPNETCORE_Kestrel__Endpoints__gRPC__Protocols: Http2
    depends_on:
      identity-api:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5

  # ── Payment Service ───────────────────────────────────────────────────────
  payment-api:
    <<: *common
    image: ${ECR_REGISTRY}/payment-api:${IMAGE_TAG:-latest}
    build:
      context: .
      dockerfile: src/Services/Payment/Payment.Api/Dockerfile
    environment:
      <<: *aws-env
      ConnectionStrings__PaymentDb: ${PAYMENT_DB_CONNECTION}
      RabbitMQ__Host: ${AMAZON_MQ_ENDPOINT}
      RabbitMQ__Username: ${AMAZON_MQ_USER}
      RabbitMQ__Password: ${AMAZON_MQ_PASSWORD}
      ASPNETCORE_URLS: http://+:8080
    depends_on:
      identity-api:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5

  # ── Notification Service ──────────────────────────────────────────────────
  notification-api:
    <<: *common
    image: ${ECR_REGISTRY}/notification-api:${IMAGE_TAG:-latest}
    build:
      context: .
      dockerfile: src/Services/Notification/Notification.Api/Dockerfile
    environment:
      <<: *aws-env
      RabbitMQ__Host: ${AMAZON_MQ_ENDPOINT}
      RabbitMQ__Username: ${AMAZON_MQ_USER}
      RabbitMQ__Password: ${AMAZON_MQ_PASSWORD}
      SendGrid__ApiKey: ${SENDGRID_API_KEY}
      ASPNETCORE_URLS: http://+:8080
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5

  # ── API Gateway ───────────────────────────────────────────────────────────
  api-gateway:
    <<: *common
    image: ${ECR_REGISTRY}/api-gateway:${IMAGE_TAG:-latest}
    build:
      context: .
      dockerfile: src/ApiGateway/ECommerce.ApiGateway/Dockerfile
    environment:
      <<: *aws-env
      ASPNETCORE_URLS: http://+:8080
    depends_on:
      catalog-api:
        condition: service_healthy
      order-api:
        condition: service_healthy
      inventory-api:
        condition: service_healthy
      payment-api:
        condition: service_healthy
      identity-api:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5

  # ── Blazor Frontend ───────────────────────────────────────────────────────
  blazor-frontend:
    <<: *common
    image: ${ECR_REGISTRY}/blazor-frontend:${IMAGE_TAG:-latest}
    build:
      context: .
      dockerfile: src/Frontend/ECommerce.Web.Blazor/Dockerfile
    environment:
      <<: *aws-env
      ApiGateway__BaseUrl: http://api-gateway:8080
      ASPNETCORE_URLS: http://+:8080
    depends_on:
      api-gateway:
        condition: service_healthy
